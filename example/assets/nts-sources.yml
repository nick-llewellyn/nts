# NTS server catalog for the example app.
#
# Curated from nts-sources.yml in https://github.com/jauderho/nts-servers,
# last reviewed against upstream commit
# b1b0902cfa6afd5b4753a49bca07286c359acf6e. Entries keep upstream's text,
# fields and order. sysadmin.wiki comes from the list at
# https://netfuture.ch/public-nts-server-list/ instead, so its vm value
# is unknown and left out.
#
# This is a subset, not a mirror: check each new upstream entry against
# the rules below and probe it with bin/nts_health.dart before adding it.
# The catalog is for end users of the example app, so it leaves out:
#
# - Distro-only servers (location "Distro"): 1-4.ntp.ubuntu.com.
# - Pool names and pool members: TimeNL's ntppool1-4.time.nl,
#   any.time.nl and nts.time.nl.
# - Servers that fail bin/nts_health.dart. Removed on 2026-11-07 after
#   failing two probes: 1.nts.nothingtohide.nl, b.st1.ntp.br,
#   ntp2.cam.ac.uk, ntpmon.dcs1.biz, ntp.trifence.ch,
#   ntp.zeitgitter.net, time.signorini.ch.
# - ntp.neu.edu.cn, ntp1.neu.edu.cn, 0.ntp.bksp.in, mirror.mdapi.ch,
#   solarium.stellata.ch and nts.amethyst.name, left out on 2026-06-29.
# - ntp-0-gnss-hq.rdem-systems.com and ntp-0-gps-hq.rdem-systems.com,
#   which are IPv6 only, left out on 2026-11-07.
#
# Running on a virtual machine is not a reason to leave a server out,
# and no fields are added to upstream's schema.
#
# Held back until the client falls back to IPv4 when a server's IPv6
# address does not answer: time.dfm.dk, nts.dogporkcow.com.
